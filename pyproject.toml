[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marketlint"
version = "0.1.0"
description = "An open-source linter and debugger for prediction markets."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Moaz Negm"}]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "typer>=0.12,<1",
  "rich>=13.7,<15",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.6,<1"]

[project.scripts]
marketlint = "marketlint.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/marketlint"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
